<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="-1000 -1000 2000 2000" style="overflow: hidden; margin: 0; display: block;">
  <style>
    .petal {
      fill: #333333;
      transform-origin: 0 0; /* pivot at base */
      animation: spiralOut 4.5s cubic-bezier(0.5, 0, 0.7, 0) infinite;
      opacity: 0;
    }

    @keyframes spiralOut {
      0% {
        transform: rotate(0deg) translateY(20px) scale(1, 1.8); /* slight spacing outward */
        opacity: 0;
      }
      8% {
        opacity: 1; /* fade in while staying slightly apart */
      }
      15% {
        transform: rotate(15deg) translateY(20px) scale(1, 1.8); /* still in place */
      }
      100% {
        transform: rotate(1080deg) translateY(1200px) scale(6, 10.8); /* now move outward */
        opacity: 0;
      }
    }

    /* staggered delays for smooth one-by-one appearance */
    .p1 { animation-delay: 0s; }
    .p2 { animation-delay: 0.25s; }
    .p3 { animation-delay: 0.5s; }
    .p4 { animation-delay: 0.75s; }
    .p5 { animation-delay: 1s; }
    .p6 { animation-delay: 1.25s; }
  </style>

  <defs>
    <path id="petal-teardrop" 
          d="M 0,22 
             C 11,22 14,18 14,12
             S 2,0 0,0 
             -14,6 -14,12 
             -11,22 0,22 Z" />
  </defs>

  <g>
    <g transform="rotate(0)">
      <use href="#petal-teardrop" class="petal p1" />
    </g>
    <g transform="rotate(60)">
      <use href="#petal-teardrop" class="petal p2" />
    </g>
    <g transform="rotate(120)">
      <use href="#petal-teardrop" class="petal p3" />
    </g>
    <g transform="rotate(180)">
      <use href="#petal-teardrop" class="petal p4" />
    </g>
    <g transform="rotate(240)">
      <use href="#petal-teardrop" class="petal p5" />
    </g>
    <g transform="rotate(300)">
      <use href="#petal-teardrop" class="petal p6" />
    </g>
  </g>
</svg>
