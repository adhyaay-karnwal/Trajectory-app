<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="-20 -50 140 200" style="overflow: visible;">
  <defs>
    <!-- Lighter gray petal -->
    <path id="petal" d="M 0,22 C 9,22 12,18 12,12 S 2,0 0,0 -12,6 -12,12 -9,22 0,22 Z" fill="#AAAAAA" />
  </defs>
  
  <g transform="translate(50, 50)">
    <!-- Petal 0 -->
    <g transform="rotate(0) translate(0,10) scale(1,1.8)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          begin="0s" dur="0.5s" repeatCount="indefinite"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
        <use href="#petal" />
      </g>
    </g>

    <!-- Petal 1 -->
    <g transform="rotate(60) translate(0,10) scale(1,1.8)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          begin="0.083s" dur="0.5s" repeatCount="indefinite"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
        <use href="#petal" />
      </g>
    </g>

    <!-- Petal 2 -->
    <g transform="rotate(120) translate(0,10) scale(1,1.8)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          begin="0.167s" dur="0.5s" repeatCount="indefinite"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
        <use href="#petal" />
      </g>
    </g>

    <!-- Petal 3 -->
    <g transform="rotate(180) translate(0,10) scale(1,1.8)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          begin="0.25s" dur="0.5s" repeatCount="indefinite"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
        <use href="#petal" />
      </g>
    </g>

    <!-- Petal 4 -->
    <g transform="rotate(240) translate(0,10) scale(1,1.8)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          begin="0.333s" dur="0.5s" repeatCount="indefinite"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
        <use href="#petal" />
      </g>
    </g>

    <!-- Petal 5 -->
    <g transform="rotate(300) translate(0,10) scale(1,1.8)">
      <g>
        <animateTransform attributeName="transform" type="scale"
          begin="0.417s" dur="0.5s" repeatCount="indefinite"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
        <use href="#petal" />
      </g>
    </g>
  </g>
</svg>