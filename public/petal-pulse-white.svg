<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="-20 -50 140 200" style="overflow: visible;">
  <defs>
    <!-- Petal path -->
    <path id="petal" d="M 0,22 C 9,22 12,18 12,12 S 2,0 0,0 -12,6 -12,12 -9,22 0,22 Z" />
  </defs>

  <g transform="translate(50,50)">
    <!-- Petals 1-6 -->
    <g transform="rotate(0) translate(0,10) scale(1,1.8)">
      <g>
        <use href="#petal" fill="#fff">
          <animate attributeName="fill" dur="0.5s"
            values="#fff;#FFD1DC;#fff" keyTimes="0;0.3;1"
            begin="0s; p6.end + 0.2s" fill="freeze" />
        </use>
        <animateTransform id="p1" attributeName="transform" type="scale"
          begin="0s; p6.end + 0.2s" dur="0.5s"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
      </g>
    </g>

    <g transform="rotate(60) translate(0,10) scale(1,1.8)">
      <g>
        <use href="#petal" fill="#fff">
          <animate attributeName="fill" dur="0.5s"
            values="#fff;#FFD1DC;#fff" keyTimes="0;0.3;1"
            begin="p1.begin + 0.1s" fill="freeze" />
        </use>
        <animateTransform id="p2" attributeName="transform" type="scale"
          begin="p1.begin + 0.1s" dur="0.5s"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
      </g>
    </g>

    <g transform="rotate(120) translate(0,10) scale(1,1.8)">
      <g>
        <use href="#petal" fill="#fff">
          <animate attributeName="fill" dur="0.5s"
            values="#fff;#FFD1DC;#fff" keyTimes="0;0.3;1"
            begin="p1.begin + 0.2s" fill="freeze" />
        </use>
        <animateTransform id="p3" attributeName="transform" type="scale"
          begin="p1.begin + 0.2s" dur="0.5s"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
      </g>
    </g>

    <g transform="rotate(180) translate(0,10) scale(1,1.8)">
      <g>
        <use href="#petal" fill="#fff">
          <animate attributeName="fill" dur="0.5s"
            values="#fff;#FFD1DC;#fff" keyTimes="0;0.3;1"
            begin="p1.begin + 0.3s" fill="freeze" />
        </use>
        <animateTransform id="p4" attributeName="transform" type="scale"
          begin="p1.begin + 0.3s" dur="0.5s"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
      </g>
    </g>

    <g transform="rotate(240) translate(0,10) scale(1,1.8)">
      <g>
        <use href="#petal" fill="#fff">
          <animate attributeName="fill" dur="0.5s"
            values="#fff;#FFD1DC;#fff" keyTimes="0;0.3;1"
            begin="p1.begin + 0.4s" fill="freeze" />
        </use>
        <animateTransform id="p5" attributeName="transform" type="scale"
          begin="p1.begin + 0.4s" dur="0.5s"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
      </g>
    </g>

    <g transform="rotate(300) translate(0,10) scale(1,1.8)">
      <g>
        <use href="#petal" fill="#fff">
          <animate attributeName="fill" dur="0.5s"
            values="#fff;#FFD1DC;#fff" keyTimes="0;0.3;1"
            begin="p1.begin + 0.5s" fill="freeze" />
        </use>
        <animateTransform id="p6" attributeName="transform" type="scale"
          begin="p1.begin + 0.5s" dur="0.5s"
          keyTimes="0;0.3;1" values="1;1.6;1"
          calcMode="spline" keySplines="0.16 1 0.3 1;0.7 0 0.3 1" />
      </g>
    </g>
  </g>
</svg>